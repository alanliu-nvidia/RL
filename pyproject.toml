[build-system]
requires = ["setuptools>=78.1.1", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nemo_rl"]

[tool.setuptools.dynamic]
# Points at the submodule, not the package (nemo_rl.__version__), so
# setuptools' attr resolution loads nemo_rl/package_info.py directly without
# first executing nemo_rl/__init__.py (which imports the rest of the
# application, e.g. nemo_rl.transformers_compat) -- verified directly:
# setuptools.config.expand.read_attr for a dotted submodule path does not
# execute the parent package's __init__.py. Needed because some Docker
# layers build nemo-rl's own metadata (e.g. a real `uv lock`, not just
# `--frozen` syncs) with only pyproject.toml/uv.lock and a couple of
# standalone nemo_rl files present, deliberately, long before the rest of
# the source tree is copied in.
version = { attr = "nemo_rl.package_info.__version__" }
readme = { file = "README.md", content-type = "text/markdown" }

[project]
name = "nemo-rl"
dynamic = ["version", "readme"]
description = "NeMo RL: A Scalable and Efficient Post-Training Library for Models Ranging from 1 GPU to 1000s, and from Tiny to >100B Parameters"
requires-python = ">=3.13.14,<3.14"
license = { text = "Apache 2.0" }
maintainers = [
  { name = "Yi-Fu Wu", email = "yifuw@nvidia.com" },
  { name = "Terry Kong", email = "terryk@nvidia.com" },
  { name = "Yuki Huang", email = "yukih@nvidia.com" },
  { name = "NVIDIA", email = "nemo-toolkit@nvidia.com" },
]
dependencies = [
  "setuptools",
  "pip",        # Required for frozen environments; uv venv --seed may not reliably install pip
  "ninja",      # for flash-attn parallel build
  # Deliberately a range, not an exact pin: each backend extra pins the torch its
  # wheels were built against (vllm/mcore/automodel: 2.13.0; sglang/trtllm:
  # 2.11.0) and resolves in its own uv conflict fork, so the base spec must admit
  # both. The ceiling keeps the driver venv from drifting to a newer torch on a
  # relock; it resolves to the highest allowed (2.13.0), matching vLLM.
  "torch>=2.11,<2.14",
  "triton; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "colored==2.2.3",
  "ray[default]>=2.58.0",                                                                                # CVE mitigation
  "wandb>=0.30.0",                                                                                       # Address dependency vulnerabilities in bundled wandb-core
  "numpy",
  "datasets>=4.0.0",
  "rich",
  "math-verify",
  "accelerate>=0.26",
  "tensorboard",
  "omegaconf",
  "torchdata",
  "nvidia-ml-py",
  "hydra-core",
  "tiktoken",
  "sentencepiece",
  "blobfile",
  "debugpy",
  "nvtx",
  "matplotlib",
  "plotly",
  "sympy>=1.14.0",
  "pillow>=12.3.0",                                                                                      # Address CVE (Pillow 12.3.0)
  "torchvision>=0.26,<0.29",                                                                             # tracks the torch range above (0.26 <-> 2.11, 0.28 <-> 2.13)
  # torchaudio and torchcodec are NOT installed in the container image.
  # Run tools/install_audio_deps.sh before using audio features or audio tests.
  # Keep the base range compatible with backend-specific pins while selecting 5.12.1
  # for the base and compatible backend environments in uv.lock.
  "transformers>=5.5.0,<=5.12.1",
  "num2words>=0.5.14",                                                                                                       # for SmolVLM
  "timm",
  "open-clip-torch>=3.2.0",
  "mlflow>=3.13.0",
  "nvidia-nvshmem-cu13>=3.6.5; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')", # for deep_ep build
  "swanlab",
  "pyzmq",
  "soundfile>=0.13.1",
  "nccl4py; sys_platform != 'darwin'",                                                                                       # for non-colocated refit
  "cuda-bindings; sys_platform != 'darwin'",                                                                                 # for non-colocated refit
  # Worker venvs run a base sync before backend extras, so NIXL must be available here.
  "nixl==1.3.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "pybase64",                                                                                                 # for sglang refit
  "awscrt>=0.35.0",                                                                                           # for parallel S3 refit transport
  "zstandard",                                                                                                # for sparse refit body compression
  "fastokens>=0.2.0",                                                                                         # Rust-backed BPE tokenizer (~10x faster encode); enable at runtime with NRL_USE_FASTOKENS=1
  # OpenTelemetry instrumentation. Base (not extra) so it reaches every worker
  # venv; `telemetry.enabled` in the config is the on/off switch. Sourced from
  # git in [tool.uv.sources] — see the note there; the floor is above the
  # newest PyPI release so a dropped pin fails to resolve instead of silently
  # falling back to 0.1.0. The aiohttp extra is what stamps a traceparent on
  # the HTTP calls NeMo-Gym's client makes, so a Gym rollout continues the
  # run's trace rather than starting its own.
  "nemo-lens[sdk,aiohttp]>=0.2.0",
  "nvidia-cudnn-cu13==9.20.0.48; sys_platform != 'darwin'", # for transformer-engine no build isolation
  # tilelang — required by fused DSA TileLang kernels on Blackwell and by the
  # replacement Triton kernel mamba-ssm requires when Triton >= 3.4.0 on Hopper;
  # see https://github.com/state-spaces/mamba/issues/640.
  # Without it, qwen3.5 / nano-v3 / moonlight Megatron recipes crash at first
  # gated-chunk backward with a RuntimeError pointing at this exact pip install.
  # Keep the base range broad for both supported Linux architectures; backend
  # extras tighten the version as required.
  "tilelang>=0.1.9,<0.1.13; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # Data-plane stack — promoted to base so worker venvs (built by
  # nemo_rl.utils.venvs.create_local_venv via bare `uv sync`, no extras)
  # automatically include them. Removes the need for a `[data-plane]`
  # extra and the corresponding plumbing in the per-worker venv builder.
  "tensordict",
  # TransferQueue v0.1.9 adds full-system checkpoint save/load APIs and
  # retains the exact-key MooncakeStore clear behavior required by DAPO.
  # Pin the immutable release commit rather than the mutable version tag.
  "TransferQueue @ git+https://github.com/Ascend/TransferQueue.git@c51614308b68c8d7a87c9b3ef62d59e14c69bde2",
  # Backs data_plane.backend="mooncake_cpu". Default backend is "simple"
  # (in-process), but the mooncake_cpu path needs the `mooncake_master`
  # binary that ships in this wheel at <site-packages>/mooncake/. Bundled
  # with TQ rather than gated behind an extra so worker venvs (built
  # without extras) can be flipped to mooncake_cpu via config alone.
  # PyPI's base `mooncake-transfer-engine` is cu12-only (links
  # libcudart.so.12), which breaks on cu13 containers. Upstream now also
  # publishes a cu13 variant as a separate distribution name
  # `mooncake-transfer-engine-cuda13` (same `mooncake/` import namespace,
  # store.so linked against libcudart.so.13). Resolve from PyPI rather
  # than the GitHub release URL — the wheel is byte-identical (verified
  # sha256), and PyPI's CDN is far more reliable than github releases
  # from compute nodes.
  # Upstream publishes both x86_64 and aarch64 wheels (see uv.lock).  CI's
  # build-container runner is aarch64 (uv reports aarch64-unknown-linux-gnu),
  # so the marker must include aarch64 — otherwise mooncake is silently
  # excluded from the resolution during the Docker build.
  # NOTE: 0.3.13.post1 is the latest release on PyPI as of this bump, but still
  # vendors golang.org/x/net v0.55.0 (confirmed via strings on libetcd_wrapper.so) --
  # one version behind the fix for a known dependency vulnerability. This bump
  # narrows the gap (v0.48.0 -> v0.55.0) but does not fully close it; re-check
  # when a newer release ships.
  "mooncake-transfer-engine-cuda13==0.3.13.post1 ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]


[project.optional-dependencies]
automodel = [
  # Colocated with vLLM engines (CUDA-IPC refit); must share vLLM's torch ABI.
  "torch==2.13.0",
  "torchvision==0.28.0",
  "nemo-automodel[moe]",
  # Automodel's FLA kernels require this TileLang version on Hopper.
  # Keep this scoped to the automodel fork; sglang intentionally pins TileLang 0.1.8.
  "tilelang==0.1.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # Flash-attn version should be selected to satisfy both TE + vLLM requirements (xformers in particular)
  # https://github.com/NVIDIA/TransformerEngine/blob/v2.3/transformer_engine/pytorch/attention/dot_product_attention/utils.py#L108
  # https://github.com/facebookresearch/xformers/blob/8354497deb2c04c67fbb2e2ad911e86530da0e90/xformers/ops/fmha/flash.py#L76
  "flash-attn==2.8.1",
  # Mirrors nemo-automodel's own `transformers==5.12.1` pin (Automodel r0.6.0).
  "transformers==5.12.1",
  "mistral-common>=1.11.0",
  "mamba-ssm",
  "causal-conv1d",
  "nv-grouped-gemm",
  # Source (the internal ADLR fork) comes from [tool.uv.sources]; a URL requirement
  # here would conflict with that source entry.
  "transformer-engine[pytorch,core_cu13]",
  "deep_ep @ git+https://github.com/deepseek-ai/DeepEP.git@58397eac493b075b0baea5861ac6e9793d8d7a21",
]
vllm = [
  # ABI of the vLLM 0.29.0 cu130 wheels.
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.12.1",
  "tilelang==0.1.12; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "cuda-python",
  "deep_gemm @ git+https://github.com/deepseek-ai/DeepGEMM.git@67fc64863d43521080bf2005e6528d0fceee9510",
  # deep_ep also needs libibverbs-dev
  # sudo apt-get update
  # sudo apt-get install libibverbs-dev
  "deep_ep @ git+https://github.com/deepseek-ai/DeepEP.git@58397eac493b075b0baea5861ac6e9793d8d7a21",
  # PyPI publishes the default cu130 wheels for both supported architectures.
  # https://github.com/vllm-project/vllm/releases/tag/v0.29.0
  # Custom build from gitlab-internal-pypi (see [tool.uv.sources]). vllm only
  # appears in this extra, so no cross-extra version conflict to reconcile --
  # pinned directly here rather than via override-dependencies.
  "vllm==0.29.0+gd1e80546846c.cu132",
  "num2words>=0.5.14",
  # Custom builds from gitlab-internal-pypi, paired with the vllm build
  # above. No [tool.uv.sources] entry for these -- Megatron-Bridge's own
  # pyproject.toml unconditionally claims flashinfer-python/-cubin for the
  # "flashinfer" index, and a competing claim from here is a hard conflict
  # regardless of markers. Declaring no source lets uv auto-discover these
  # from gitlab-internal-pypi (now a non-explicit index); versions pinned in
  # override-dependencies, which also reconciles Megatron-Bridge's own
  # flashinfer-python==0.6.18.post1 pin and sglang's own
  # nvidia-cutlass-dsl[cu13]==4.6.0 pin (incompatible with this build's
  # nvidia-cutlass-dsl>=4.6.2a0 floor) -- see override-dependencies.
  "flashinfer-python",
  "flashinfer-cubin",
  "flashinfer-jit-cache",
  # flashinfer-jit-cache's own transitive dependency, never otherwise a
  # direct requirement anywhere -- needs to be declared directly for its
  # [tool.uv.sources] index routing to actually apply (uv otherwise reports
  # "not found in the package registry" despite it being published there).
  "flashinfer-jit-cache-sm100f",
  "nvidia-cutlass-dsl[cu13]",
]
sglang = [
  # sglang-miles (3003d70f) and sglang-kernel 0.4.5 are built against torch 2.11;
  # on 2.13 sgl_kernel fails with `undefined symbol: _ZNK2at10TensorBase14const_data_ptr…`.
  "torch==2.11.0",
  "torchvision==0.26.0",
  # sgl-project/sglang branch `sglang-miles` (based on v0.5.16). Needed for the
  # begin_weight_update / end_weight_update refit session: quantized weights
  # carry derived scales (swizzled blockscales, g1/g2 alphas) that have to be
  # re-materialized once, after the last bucket lands. No tagged release has
  # those endpoints, and re-running the finalize per bucket is not idempotent.
  "sglang",
  "sglang-kernel==0.4.5",                                                       # Direct dep for explicit version control; required by sglang-miles
  "sglang-router",                                                              # Used by nemo_rl.models.generation.sglang.sglang_router for multi-engine routing
  "kernels>=0.14.1,<0.15",
  # Version pinned in override-dependencies (same build as vllm/mcore -- see
  # the comment there for why sglang isn't kept on an independent version).
  "flashinfer-python",
  "flashinfer-cubin",
  "flashinfer-jit-cache",
  "flashinfer-jit-cache-sm100f",
  "transformers==5.12.1",
  "tilelang==0.1.11; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
mcore = [
  # also need cudnn (https://developer.nvidia.com/cudnn-downloads?target_os=Linux&target_arch=x86_64&Distribution=Ubuntu&target_version=20.04&target_type=deb_network)
  # wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.1-1_all.deb
  # sudo dpkg -i cuda-keyring_1.1-1_all.deb
  # sudo apt-get update
  # sudo apt-get install cudnn-cuda-13

  # megatron-bridge is installed straight from the submodule's own pyproject.toml, so its
  # dependencies (transformers, transformer-engine, megatron-core[dev,mlm] -> nvidia-modelopt,
  # onnxscript, flash-linear-attention, ...) flow transitively and pick up upstream changes on
  # every submodule bump + `uv lock`. Do not mirror them here. transformer-engine's exact
  # version is still pinned globally via [tool.uv] override-dependencies.
  # [te]/[ssm] activate megatron-bridge's transformer-engine and mamba-ssm/causal-conv1d extras.
  # megatron-core is intentionally NOT listed: it flows from megatron-bridge's own
  # dependency megatron-core[dev,mlm] and its [tool.uv.sources] path mapping, so Megatron-LM
  # pyproject changes propagate on bump without any mirror here.
  "megatron-bridge[te,ssm]",
  # Colocated with vLLM engines (CUDA-IPC refit); must share vLLM's torch ABI.
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.12.1",
  "tilelang==0.1.9; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # Flash-attn version should be selected to satisfy both TE + vLLM requirements (xformers in particular)
  # https://github.com/NVIDIA/TransformerEngine/blob/v2.3/transformer_engine/pytorch/attention/dot_product_attention/utils.py#L108
  # https://github.com/facebookresearch/xformers/blob/8354497deb2c04c67fbb2e2ad911e86530da0e90/xformers/ops/fmha/flash.py#L76
  "flash-attn==2.8.1",
  # FlashAttention-4: Megatron-Core gates it behind flash_attention_version=4
  # (megatron/core/transformer/attention.py HAVE_FA4 check), so it's additive
  # alongside the FA2 pin above rather than a replacement.
  "flash-attn-4[cu13]==4.0.0b19 ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # quack-kernels 0.6.5 does not work with flash-attn-4; keep in sync with override-dependencies.
  "quack-kernels==0.6.1 ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # mamba-ssm/causal-conv1d LOOK redundant (megatron-bridge[ssm] pulls them), but do not
  # remove them: [tool.uv.sources] git pins only attach to direct requirements, and the
  # conflicting extras resolve in separate forks — without these direct deps the mcore fork
  # silently falls back to the PyPI releases instead of the pinned git revs.
  "mamba-ssm",
  "causal-conv1d",
  "deep_ep @ git+https://github.com/deepseek-ai/DeepEP.git@58397eac493b075b0baea5861ac6e9793d8d7a21",
  # Same custom build as the vllm extra -- version pinned in
  # override-dependencies (see the vllm extra's comment for why).
  "flashinfer-python",
  "flashinfer-cubin",
  "flashinfer-jit-cache",
  "flashinfer-jit-cache-sm100f",
  "flash_mla ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # Real PyPI release, same as every other extra. A floor is now pinned in
  # override-dependencies (see there for why); otherwise unconstrained here,
  # so the resolver still picks whatever compatible real release satisfies
  # flash-attn-4/flashinfer-python/megatron-core's various floors.
  "nvidia-cutlass-dsl[cu13] ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # Custom fused GDP attention kernels, from gitlab-internal-pypi (see
  # [tool.uv.sources]; not on PyPI). Version is pinned in override-dependencies.
  "gdp-attn-fused ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  # cutlass.tensor_utils, which no published nvidia-cutlass-dsl release
  # provides (gdp-attn-fused needs it). Coexists with the real
  # nvidia-cutlass-dsl above via a .pth shim the wheel ships -- do NOT drop
  # the real one thinking this replaces it: flash-attn-4 does a runtime
  # importlib.metadata lookup for the literal name "nvidia-cutlass-dsl" and
  # crashes with "No package metadata was found" if that distribution isn't
  # actually installed, even though its imported cutlass module content
  # comes from this package instead (verified in Dockerfile.training, the
  # nv-mistralai-megatron reference this pattern is copied from). Not
  # published yet as of this writing.
  "nvidia-cutlass-dsl-internal ; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
  "torch-memory-saver>=0.0.9.post1",
  "nvshmem4py-cu13>=0.2.1",
  "cupy-cuda13x",
  # megatron-energon already flows in transitively (megatron-core[dev,mlm] declares it), so
  # this is not a mirror in the sense forbidden above -- it is a deliberately tighter floor:
  # Megatron-LM pins ~=7.0, and the energon SFT path requires 7.3+.
  # tests/unit/test_dependency_pins.py fails if Megatron-LM's own pin moves, so a
  # Megatron-Bridge bump forces a re-check of this floor.
  "megatron-energon[av-decode]~=7.3", # for energon backend
  # av is needed for Nemotron but we should not include in public container
  # because it includes ffmpeg
  "av==18.1.0",
]
# TRT-LLM is built from source via 3rdparty/TensorRT-LLM-workspace's custom PEP 517
# backend (_backend.py). The path source lets uv lock resolve the dep graph
# without compiling (prepare_metadata_for_build_wheel returns static metadata).
# The actual ~60-min wheel build is triggered by `uv sync --extra trtllm`.
trtllm = [
  # tensorrt-llm 1.3.0rc21 requires torch<=2.13.0a0 and its libth_common.so is
  # built against 2.11 (`undefined symbol: _ZNR5torch7Library4_def…` on 2.13).
  "torch==2.11.0",
  "torchvision==0.26.0",
  "tensorrt-llm==1.3.0rc21",
  "transformers==5.5.4",
  "tilelang==0.1.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # tensorrt-llm 1.3.0rc21's _ipc_utils.py reads `cudaIpcMemHandle_t.reserved`,
  # which cuda-bindings 13.4 removed; every TP>1 TRT-LLM engine then dies in
  # allocate_allreduce_fusion_workspace with an AttributeError. Hold this venv
  # on the 13.3 series that tensorrt-llm was released against.
  "cuda-python<13.4",
  "cuda-bindings<13.4",
]
modelopt = ["nvidia-modelopt"]
nvrx = [
  "nvidia-resiliency-ext @ git+https://github.com/NVIDIA/nvidia-resiliency-ext.git@d23f0a11310ab7fd2e73a578511cdf7ccfd60fc7",
] # for ft_launcher (fault-tolerant training launcher)
nemo_gym = ["nemo_gym"]

[dependency-groups]

# This is a default group so that we install these even with bare `uv sync`
build = [
  # Build requirement for TE (version comes from the extra being synced)
  "torch",
  # Build requirement for TE
  "setuptools",
  "packaging",
  "einops",
  # Build requirement for nemo_run
  "hatchling",
  # Build requirement for mcore
  "pybind11",
  # Build requirement for flash-attn
  "psutil",
]
docs = [
  "sphinx",
  "sphinx-autobuild",          # For live doc serving while editing docs
  "sphinx-autodoc2",           # For documenting Python API
  "sphinx-copybutton",         # Adds a copy button for code blocks
  "sphinx-design",             # For design components in docs
  "myst_parser",               # For our markdown docs
  "nvidia-sphinx-theme",       # Our NVIDIA theme
  "gitpython>=3.1.45",         # To git-related information
  "python-dotenv",             # For environment variable management
  "sphinxcontrib-mermaid",     # For Mermaid diagram support
  "swagger-plugin-for-sphinx", # For Swagger/OpenAPI documentation
]
dev = [
  "pre-commit>=4.2.0",
  "ruff==0.9.9",
  "types-PyYAML",
  "types-requests",
  "pyrefly==0.24.2",
]
test = [
  "pytest>=8.4.2",
  "pytest-timeout",
  "pytest-cov",
  "pytest-asyncio",
  "pytest-testmon",
  "pytest-shard",
]

[tool.uv.sources]
# tensorrt-llm is built from source via a custom PEP 517 backend in 3rdparty/TensorRT-LLM-workspace/.
# prepare_metadata_for_build_wheel returns static metadata fast (for `uv lock`);
# build_wheel triggers the actual ~60-min compilation (during `uv sync --extra trtllm`).
tensorrt-llm = { path = "3rdparty/TensorRT-LLM-workspace" }
nemo-automodel = { path = "3rdparty/Automodel-workspace/Automodel", editable = true }
megatron-bridge = { path = "3rdparty/Megatron-Bridge-workspace/Megatron-Bridge", editable = true }
# Keep Gym as an editable path dependency rather than a workspace member. Both
# projects define a ``vllm`` extra with intentionally different server stacks;
# uv applies a requested extra name to every selected workspace member, which
# makes the RL vLLM + base Gym worker environment impossible to select.
nemo_gym = { path = "3rdparty/Gym-workspace/Gym", editable = true }
nemo_run = { git = "https://github.com/NVIDIA-NeMo/Run", rev = "414f0077c648fde2c71bb1186e97ccbf96d6844c" }
# Deliberately ahead of the v0.2.0 rev megatron-core pins: this rev carries the
# SpanRegistry that `span_groups` registers into and the metric registry the
# `rl` group is declared through, neither of which exists in v0.2.0. Keep in
# sync with the matching [tool.uv] override-dependencies entry, which is what
# actually reconciles the two revs; the floor in [dependencies] stays above the
# newest PyPI release so dropping either one fails to resolve instead of
# falling back to 0.1.0.
nemo-lens = { git = "https://github.com/NVIDIA-NeMo/Lens.git", rev = "b0f977d414b2f89938604a0b7eaa78ee08bc8700" }
sglang = { git = "https://github.com/sgl-project/sglang.git", rev = "3003d70f680d41c59d1b7acbf65cb47795dfd19e", subdirectory = "python" }
# torch/torchvision/triton all come from the torch index in order to pick up aarch64 wheels
torch = [
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
triton = [
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
  { index = "pypi", marker = "sys_platform == 'darwin'" },
]
causal-conv1d = { git = "https://github.com/Dao-AILab/causal-conv1d", rev = "cd81f0413cad2fc1e6f17e785ac39f59aae690cd" }
mamba-ssm = { git = "https://github.com/state-spaces/mamba.git", rev = "e9594ce1c732d97440f0332fdc43170a2294dbfa" }
nv-grouped-gemm = { git = "https://github.com/fanshiqing/grouped_gemm", tag = "v1.1.4.post7" }
# FlashMLA derives its version from the Git revision in setup.py. Keep this pin
# synchronized with the static dependency metadata below.
flash_mla = { git = "https://github.com/deepseek-ai/FlashMLA", rev = "b7643bd54521f563b839b98289b5cd048c062ba2" }
# Pinned to 43fd41a58 (2026-08-15, release cherry-pick branch). It carries #2054 ("Fix vLLM
# 0.24+ compatibility": the vLLM plugin registers on `RoutedExperts`; the older plugin
# registered on `fused_moe.layer.FusedMoE`, which vLLM >= 0.28 removed, and NeMo-RL's explicit
# re-import then failed with "RowParallelLinear already registered") but NOT 2ded5aba3
# (#1550, 2026-08-07). Do not move to a revision that contains #1550 without porting
# nemo_rl/modelopt: its per-expert `GroupedQuantizer` modules break the Megatron fakequant
# DDP hook bookkeeping (`KeyError: GroupedQuantizer(...)` in `disable_forward_pre_hook`) and
# real-quant dist-checkpoint sharding validation (`Invalid access pattern for
# ShardedTensor(... experts.N.linear_fc1.weight_quantizer._amax`).
nvidia-modelopt = { git = "https://github.com/NVIDIA/Model-Optimizer", rev = "43fd41a58d52c4e6e5dec1d1ff5989ecc737ae1a" }
nvidia-resiliency-ext = { git = "https://github.com/NVIDIA/nvidia-resiliency-ext.git", rev = "d23f0a11310ab7fd2e73a578511cdf7ccfd60fc7" }
# Custom builds from gitlab-internal-pypi, paired together (the custom vllm
# build needs this specific flashinfer-python). Megatron-Bridge's own
# pyproject.toml unconditionally claims flashinfer-python/-cubin for its
# "flashinfer" index -- uv's index-conflict check is workspace-global, not
# fork-aware (verified: even a source scoped to an extra that never
# co-resolves with Megatron-Bridge still conflicts), so there is no way to
# have mcore stay on stock flashinfer while vllm uses this custom build.
# tools/patch-megatron-bridge-flashinfer.sh patches Megatron-Bridge's own
# pyproject.toml to point at gitlab-internal-pypi too, so both sides agree.
# Versions pinned in override-dependencies, forced across every extra that
# declares these packages (including sglang, which otherwise has its own,
# incompatible nvidia-cutlass-dsl pin -- see override-dependencies).
# flashinfer-jit-cache-sm100f is flashinfer-jit-cache's own transitive
# dependency (not declared anywhere else), also only published here.
vllm = { index = "gitlab-internal-pypi" }
flashinfer-python = { index = "gitlab-internal-pypi" }
flashinfer-cubin = { index = "gitlab-internal-pypi" }
flashinfer-jit-cache = { index = "gitlab-internal-pypi" }
flashinfer-jit-cache-sm100f = { index = "gitlab-internal-pypi" }
# nvidia-cutlass-dsl deliberately has NO entry here: it stays a normal PyPI
# dependency everywhere (vllm, mcore, transitively via flash-attn-4/
# flashinfer-python/megatron-core). nvidia-cutlass-dsl-internal below is an
# ADDITIVE, separately-named package (not a same-name replacement), so it
# coexists with the real nvidia-cutlass-dsl in mcore's venv via a .pth shim
# rather than fighting it for a single version -- see the mcore extra's
# comment for why the real one still has to stay installed too.
gdp-attn-fused = { index = "gitlab-internal-pypi" }
nvidia-cutlass-dsl-internal = { index = "gitlab-internal-pypi" }
# Internal ADLR forks (nemotron4 branch), not upstream. Fetched over HTTPS with
# credentials supplied by a git credential helper set up in docker/Dockerfile
# from a CI_JOB_TOKEN build secret -- never embed the token in these URLs
# directly, since it would end up recorded in uv.lock and in the exported uv
# cache seed image. cudnn-frontend must resolve before transformer-engine,
# which needs its headers at build time; that ordering falls out of
# transformer-engine's own dependency graph, not from anything declared here.
transformer-engine = { git = "https://gitlab-master.nvidia.com/ADLR/transformer_engine.git", rev = "1ac66e5a2e9666b36dc5e0b6e8ce1a4ce3a5a86f" }
nvidia-cudnn-frontend = { git = "https://gitlab-master.nvidia.com/ADLR/cudnn_frontend.git", rev = "d844f3053f924fccf9f7ada0084c012eba1d20a9" }

[tool.uv.workspace]
members = [
  # Research projects are also added here in order for them to share the global root level uv.lock.
  # If we don't do this, the research projects do not see the global uv.lock, and may mistakenly
  # install numpy>=2.0 because nemo-rl's core [dependencies] do not pin numpy, but when you inspect
  # nemo-rl's uv.lock you'll see it's 1.X b/c megatron mandates 1.X in the optional dependencies, so
  # globally we must choose 1.X otherwise we run into pickle issues from ray.
  "research/template_project",
  "research/flow_grpo",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer"
# Keep this spelling (trailing slash included) identical to Megatron-Bridge's
# flashinfer [[tool.uv.index]] entry: uv treats differently spelled URLs for the
# same package as conflicting indexes and refuses to lock.
url = "https://flashinfer.ai/whl/"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

# Custom internal wheels (gdp-attn-fused, nvidia-cutlass-dsl-internal, vllm,
# flashinfer-python/-cubin/-jit-cache), authenticated via CI_JOB_TOKEN in
# docker/Dockerfile. gdp-attn-fused is published; nvidia-cutlass-dsl-internal
# is not yet as of this writing -- `uv lock` will fail until it is.
# authenticate = "always" because GitLab-hosted indexes silently fall back to
# an unauthenticated (empty) response instead of erroring, which uv's own
# docs call out by name as a footgun for this exact provider.
# explicit = true, like every other custom index here: a non-explicit index
# gets auto-searched for EVERY package in the workspace, not just the ones
# that opt in via [tool.uv.sources] -- tried that to dodge Megatron-Bridge's
# conflicting flashinfer-python/-cubin source claim, and it silently routed
# 500+ unrelated packages through this private index instead of PyPI. Fixed
# properly by patching Megatron-Bridge's own pyproject.toml instead (see
# tools/build-custom-flashinfer.sh) so its source claim matches ours.
[[tool.uv.index]]
name = "gitlab-internal-pypi"
url = "https://gitlab-master.nvidia.com/api/v4/projects/65523/packages/pypi/simple"
explicit = true
authenticate = "always"

[tool.uv]
managed = true
environments = [
  "python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
  "python_version == '3.13' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]
preview = true # Enable preview features like extra-build-dependencies
no-build-isolation-package = [
  "transformer-engine-torch",
  # Building from the internal ADLR fork (see [tool.uv.sources]) instead of the
  # prebuilt PyPI wheel; needs torch present at build time, same as -torch above.
  # nvidia-cudnn-frontend deliberately stays OUT of this list: its build needs
  # cmake/ninja/pybind11, which the base image doesn't carry, so it keeps normal
  # build isolation (a fresh env with those declared as its own build deps).
  "transformer-engine",
  "flash-attn",
  "mamba-ssm",
  "causal-conv1d",
  "fast-hadamard-transform",
  "deep_gemm",
  "deep_ep",
  "flash_mla",
  "nv-grouped-gemm",          # from mlm (added here to make sure it's built no isolation since mlm workspace uses setup.py)
  "tensorrt-llm",             # custom PEP 517 backend calls build-custom-trtllm.sh; needs torch/CUDA from main venv
]
# Always apply the build group since dependencies like TE/mcore/nemo-run require build dependencies
# and this lets us assume they are implicitly installed with a simply `uv sync`. Ideally, we'd
# avoid including these in the default dependency set, but for now it's required.
default-groups = ["dev", "build"]
# Users may use different link-modes depending on their scenario:
#  --link-mode=hardlink (default on linux; may get warnings about switching to --link-mode copy if uv cache and venv on different file-systems)
#  --link-mode=copy (slower but more reliable; supresses warning)
#  --link-mode=symlink (fastest option when uv cache and venv on different file-system; caveat: venv is brittle since it depends on the environment/container)
link-mode = "copy"
# The TE override is needed to pin the TE version across all extras
# The opencv-python-headless override excludes it from the shipped container (sys_platform == 'never')
# because its bundled FFmpeg codec libs (H.264, H.265, AAC) may incur royalties. The CVE floor
# (>=5.0.0) is kept separately in constraint-dependencies so it applies to anyone who does install it.
# Installed at runtime via tools/install_audio_deps.sh (--no-config bypasses the override there).
# vllm defaults to opencv for video IO but falls back to torchcodec.
# The timm override is needed because sglang requires timm==1.0.16.
override-dependencies = [
  # megatron-bridge[ssm] pins mamba-ssm==2.3.1, which doesn't exist at the git rev
  # in [tool.uv.sources]. Force that exact (untagged) commit here; keep the rev in
  # sync with [tool.uv.sources] and the mamba-ssm dependency-metadata version.
  "mamba-ssm @ git+https://github.com/state-spaces/mamba.git@e9594ce1c732d97440f0332fdc43170a2294dbfa",
  # transformer-engine and nvidia-cudnn-frontend versions are no longer pinned
  # to an exact release here: both now come from the internal ADLR forks in
  # [tool.uv.sources], whose commit (not a released version) is the actual
  # pin; see the comment there. A bare, versionless override IS still needed
  # for nvidia-cudnn-frontend: megatron-core[dev] (transitive via
  # megatron-bridge) hard-pins nvidia-cudnn-frontend[cutedsl]==1.26.0, which
  # demands nvidia-cutlass-dsl[cu13]==4.5.0. This strips that rigid version
  # constraint (the fork's own cutedsl extra only floors at
  # nvidia-cutlass-dsl[cu13]>=4.5.0), which matters regardless of what
  # nvidia-cutlass-dsl itself resolves to.
  "nvidia-cudnn-frontend",
  # Also bare/versionless: megatron-core's own "te" extra (activated via
  # megatron-bridge[te], which the mcore extra's "megatron-bridge[te,ssm]"
  # turns on) hard-pins transformer-engine to a DIRECT git URL
  # (github.com/NVIDIA/TransformerEngine.git), which bypasses [tool.uv.sources]
  # entirely -- source redirection only applies to plain-name requirements.
  # This override strips that embedded URL so resolution falls through to
  # [tool.uv.sources]'s ADLR fork instead.
  "transformer-engine",
  # gitlab-internal-pypi is a mutable PyPI-style index (no immutable git rev
  # to anchor it, unlike the ADLR forks above), so pin its packages' exact
  # versions here -- without it, a future upload silently changes what mcore
  # resolves to on the next `uv lock`. Centralized rather than inline on the
  # mcore extra's requirement lines, which intentionally carry no version.
  "gdp-attn-fused==0.5.0+cp.dkg4408763",
  # nvidia-cutlass-dsl-internal not yet pinned here: not published yet (see
  # [tool.uv.index]), so its real version string isn't known. Add a
  # "nvidia-cutlass-dsl-internal==..." entry here once it is, following the
  # gdp-attn-fused pattern above.
  "nvidia-cublas==13.5.1.27; sys_platform != 'darwin'",
  "nvidia-cudnn-cu13==9.20.0.48; sys_platform != 'darwin'",
  # NCCL 2.30.4 fixes a context-parallel hang on GB200 when GPUs are non-contiguous;
  # 2.30.7 additionally fixes hangs in the NCCL m2n reshard (<link to NCCL release note / internal bug>).
  # An override is required because torch 2.11.0+cu130 pins nvidia-nccl-cu13==2.28.9.
  "nvidia-nccl-cu13==2.31.2",
  "nvidia-nvshmem-cu13>=3.6.5; sys_platform != 'darwin'",
  "opencv-python-headless; sys_platform == 'never'",
  "timm<=1.0.22",
  "fastapi[standard]>=0.133.0,<0.137.0",
  "nvidia-modelopt[torch]>=0.44.0a0",
  # vLLM 0.29 lists instanttensor (the optional `load_format="instanttensor"`
  # safetensors loader) as an unconditional dependency. NeMo-RL never selects
  # that load format and vLLM imports it lazily, so it is kept on x86_64 only;
  # on aarch64 (GB200) the dependency is dropped rather than installed. 0.2.0
  # ships aarch64 wheels, so this is a choice, not a wheel-availability limit.
  "instanttensor>=0.1.9; platform_machine == 'x86_64'",
  "llguidance>=1.7.0,<1.8.0",
  # Override setuptools range in other dependencies to address CVE GHSA-58pv-8j8x-9vj2
  "setuptools>=80.10.2",
  "deep_ep @ git+https://github.com/deepseek-ai/DeepEP.git@58397eac493b075b0baea5861ac6e9793d8d7a21",
  # Relax megatron-core workspace member's opentelemetry-api ceiling (<1.34) for protobuf 6.x compat with ray
  "opentelemetry-api>=1.33.1",
  # Override sglang's xgrammar==0.1.32 to address CVE GHSA-7rgv-gqhr-fxg3.
  # Floor raised to 0.2.1 for vLLM 0.25.1, whose tool-choice handling imports
  # xgrammar.normalize_tool_choice (vLLM requires xgrammar>=0.2.1,<1.0.0; the
  # override would otherwise force an incompatible downgrade).
  "xgrammar>=0.2.1,<1.0.0",
  # tensorrt-llm 1.3.0rc21 pins apache-tvm-ffi==0.1.6, while xgrammar needs
  # >=0.1.9. TileLang 0.1.11's bundled compiler additionally requires the
  # 0.1.11 ABI, so keep the shared override on that compatible release.
  "apache-tvm-ffi==0.1.11",
  # Override dependencies to address CVEs
  "mlflow>=3.13.0",
  # Override langchain-core to address CVE GHSA-qh6h-p6c9-ff54 (path traversal in load_prompt)
  "langchain-core>=1.2.22",
  # Override outlines for Python 3.13 support
  "outlines>=0.2.0",
  # Upgrade pytest to 9.0.3
  "pytest>=9.0.3",
  "langchain>=0.3.28",      # Address CVE-2025-65106
  "langchain-core>=0.3.80", # Address CVE-2025-65106
  # Forces numpy past tensorrt-llm's `numpy>=2.0.0,<2.4` cap. The original
  # driver — TransferQueue pinning `numpy<2.0.0` — is gone as of TQ v0.1.9;
  # drop this override once the trtllm cap lifts. The `<2.5` ceiling keeps the
  # override inside numba's metadata bound: vLLM 0.29 pins `numba==0.65.0`,
  # which requires `numpy<2.5` and refuses to import against 2.5.x
  # ("Numba needs NumPy 2.4 or less"), leaving a broken numba in the vLLM venv.
  "numpy>=2.1.0,<2.5",
  # decord2 is pulled transitively by sglang → qwen-vl-utils[decord] on aarch64 Linux.
  # NeMo-RL no longer calls any decord API (replaced by torchvision/torchaudio).
  "decord2; sys_platform == 'never'",
  "emerging-optimizers @ git+https://github.com/NVIDIA-NeMo/Emerging-Optimizers.git@v0.4.0",
  "nvidia-resiliency-ext @ git+https://github.com/NVIDIA/nvidia-resiliency-ext.git@d23f0a11310ab7fd2e73a578511cdf7ccfd60fc7",
  # megatron-core still pins lens v0.2.0 in its own [tool.uv.sources]; without an
  # override the two git URLs are a hard conflict, since the workspace resolves a
  # single nemo-lens. We need the newer rev for `SpanRegistry` (which replaced the
  # shipped `SpanGroup` class) and the consumer-driven metric registry
  # (`MetricSpec`/`register_metric_group`), both of which landed after v0.2.0. Drop
  # this once Megatron-LM bumps to the same or newer rev.
  "nemo-lens[sdk,aiohttp] @ git+https://github.com/NVIDIA-NeMo/Lens.git@b0f977d414b2f89938604a0b7eaa78ee08bc8700",
  # Custom build from gitlab-internal-pypi, paired with the vllm extra's
  # custom vllm build (see the vllm extra's comment and the
  # [tool.uv.sources] comment for why no source is declared for these).
  # Forced workspace-wide: this is what reconciles Megatron-Bridge's own
  # flashinfer-python==0.6.18.post1 pin (in its own pyproject.toml, not ours)
  # with the version we actually want for vllm/mcore. It also sweeps sglang
  # onto this build, since override-dependencies can't be scoped per-extra.
  "flashinfer-python==0.7.0+g07a99a54b25e.cu132",
  "flashinfer-cubin==0.7.0+g07a99a54b25e.cu132",
  "flashinfer-jit-cache==0.7.0+g07a99a54b25e.cu132",
  # Floor required by the flashinfer-python build above
  # (nvidia-cutlass-dsl>=4.6.2a0). sglang's own pin is the exact, older
  # nvidia-cutlass-dsl[cu13]==4.6.0 -- this override replaces that pin
  # workspace-wide (including for sglang) rather than leaving the two
  # incompatible. Unverified: whether sglang's own code is actually
  # compatible with cutlass-dsl past 4.6.0, or only pinned there out of
  # caution -- this resolves cleanly but carries a real, un-tested runtime
  # risk for sglang specifically.
  "nvidia-cutlass-dsl[cu13]>=4.6.2a0",
  # The custom vllm build above requires mcp>=2.0.0 (unlike stock
  # vllm==0.29.0, which resolves mcp fine at 1.30.0 -- see git history for
  # the investigation). mcp 2.0.0 is a deliberate, documented breaking
  # rework of the SDK; nemo-gym's own mcp>=1.28.1,<2 pin matches upstream's
  # own recommendation to stay on v1 until migrated. Forcing 1.30.0 here
  # reuses the version already known to work with both stock vllm and
  # nemo-gym; the residual risk is whether the custom vllm build's actual
  # code changes depend on an mcp v2-only API that 1.30.0 doesn't have.
  "mcp==1.30.0",
  # Nemotron 4 needs transformers 5.17.0
  "transformers==5.17.0",
  # quack-kernels 0.6.5 does not work with flash-attn-4
  "quack-kernels==0.6.1",
]

# CVE fixes
constraint-dependencies = [
  # emerging-optimizers / fast-hadamard-transform flow transitively from megatron-core[dev],
  # whose [tool.uv.sources] pins them to git. uv requires such URL deps to also appear as a
  # direct requirement or constraint of the root project. Keep these URLs/revs in sync with
  # Megatron-LM's [tool.uv.sources] (uv errors loudly on mismatch after a submodule bump).
  "emerging-optimizers @ git+https://github.com/NVIDIA-NeMo/Emerging-Optimizers.git@v0.4.0",
  "fast-hadamard-transform @ git+https://github.com/Dao-AILab/fast-hadamard-transform.git@f134af63deb2df17e1171a9ec1ea4a7d8604d5ca",
  # Same story for megatron-fsdp, which nemo-automodel (r0.6.0) resolves from a
  # Megatron-LM fork via its own [tool.uv.sources] instead of PyPI. Keep this URL/rev
  # in sync with 3rdparty/Automodel-workspace/Automodel/pyproject.toml.
  "megatron-fsdp @ git+https://github.com/yuhezhang-ai/Megatron-LM.git@455389c480af6b3acdca74c7830c68b3274eb083#subdirectory=megatron/core/distributed/fsdp/src",
  # megatron-energon pulls s3fs; without a floor uv picks the 2020-era s3fs 0.4.2
  # (which needs only plain botocore) instead of a modern aiobotocore-based release.
  "s3fs>=2024.6.0",
  "brotli>=1.2.0",            # Address CVE GHSA-2qfp-q593-8484
  "starlette>=0.49.1",        # Address CVE GHSA-7f5h-v6xp-fcq8
  "urllib3>=2.7.0",           # Address CVE GHSA-38jv-5279-wg99
  "aiohttp>=3.13.3",          # Address CVE GHSA-mqqc-3gqh-h2x8
  "pyasn1>=0.6.3",            # Address CVE GHSA-jr27-m4p2-rc6r
  "wheel>=0.46.2",            # Address CVE GHSA-8rrh-rw8j-w5fx
  "protobuf>=6.33.5",         # Address CVE GHSA-7gcm-g887-7qv7
  "python-multipart>=0.0.22", # Address CVE GHSA-wp53-j4wj-2cfg
  "pygments>=2.20.0",         # Address CVE GHSA-5239-wwwm-4pmq
  "cbor2>=5.9.0",             # Address CVE GHSA-3c37-wwvx-h642
  "onnx>=1.21.0rc4",          # Address CVE GHSA-hqmj-h5c6-369m
  "cryptography>=48.0.1",     # Address CVE GHSA-6w46-j5rx-g56g, GHSA-537c-gmf6-5ccf
  "orjson>=3.11.6",           # Address CVE GHSA-hx9q-6w63-j58v
  "pyjwt>=2.13.0",
  "dulwich>=1.2.5",
  "diffusers>=0.38.0",
  # 8.0.1 fixed _IncludedRouter.path crash on fastapi>=0.137 (github.com/trallnag/prometheus-fastapi-instrumentator/issues/370)
  "prometheus-fastapi-instrumentator>=8.0.2",
  "av>=17.1.0",                               # Address CVE-2026-40962 (FFmpeg 8.0.1 bundled in av.libs; 17.1.0+ ships FFmpeg 8.1.x)
  "opencv-python-headless>=5.0.0",            # CVE floor: patches CVE-2025-9951, CVE-2025-1594, CVE-2024-31582 (bundled FFmpeg 5.1.6 in 4.x)
]

# NOTE: do not exclude `nvidia-cutlass-dsl-libs-base` again. The 4.5.x workaround for
# https://github.com/NVIDIA/cutlass/issues/3259 (libs-base and libs-cu13 wrote the same
# paths) is obsolete: 4.6 split the wheels so libs-base ships the whole Python `cutlass`
# DSL (`cutlass.cute`, `cutlass._mlir.dialects`, ...) and libs-cu13 only the CUDA-13
# `_cutlass_ir` extension, with no overlapping files. flashinfer >= 0.6.16 imports
# `cutlass.cute` at module load (`gdn_prefill` -> `delta_rule_dsl.varlen_helper`), and
# vLLM 0.28 imports `flashinfer.gdn_prefill` eagerly, so excluding libs-base breaks every
# Qwen3.5 model and every Blackwell vLLM worker with `ModuleNotFoundError: cutlass.cute`.

conflicts = [
  [{ extra = "automodel" }, { extra = "sglang" }],
  [{ extra = "mcore" }, { extra = "sglang" }],
  [{ extra = "vllm" }, { extra = "sglang" }],
  [{ extra = "automodel" }, { extra = "mcore" }],
  [{ extra = "automodel" }, { extra = "vllm" }],
  [{ extra = "vllm" }, { extra = "mcore" }],
  [{ extra = "trtllm" }, { extra = "vllm" }],
  [{ extra = "trtllm" }, { extra = "sglang" }],
  [{ extra = "trtllm" }, { extra = "automodel" }],
  [{ extra = "trtllm" }, { extra = "mcore" }],
  [{ extra = "trtllm" }, { extra = "modelopt" }],
  [{ extra = "trtllm" }, { extra = "nvrx" }],
  [{ extra = "trtllm" }, { extra = "nemo_gym" }],
  # Gym pins openai==2.44.0 (merged PR #2872 tree) while sglang==0.5.12.post1
  # pins openai==2.6.1; no environment installs both extras together.
  # Spelled nemo_gym (the raw extras-table key): uv < 0.12 compares conflict
  # entries against unnormalized extra names and rejects "nemo-gym".
  [{ extra = "nemo_gym" }, { extra = "sglang" }],
]


# Augment build dependencies for packages that need torch at build time
[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
# Git-sourced packages CAN use match-runtime = true if we provide dependency-metadata
deep_ep = [{ requirement = "torch", match-runtime = true }]
deep_gemm = [{ requirement = "torch", match-runtime = true }]
transformer-engine-torch = [{ requirement = "torch", match-runtime = true }]
transformer-engine = [{ requirement = "torch", match-runtime = true }]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]
fast-hadamard-transform = [{ requirement = "torch", match-runtime = true }]
nv-grouped-gemm = [{ requirement = "torch", match-runtime = true }]
flash_mla = [{ requirement = "torch", match-runtime = true }]

# torch-memory-saver's build backend reads TMS_CUDA_MAJOR at build time. Keep this in
# sync with docker/Dockerfile's BASE_IMAGE CUDA major version (currently cuda13.x).
[tool.uv.extra-build-variables]
torch-memory-saver = { TMS_CUDA_MAJOR = "13" }
# flash-attn 2.8.1 has no prebuilt wheel for torch >= 2.11, so it compiles from the sdist.
# Its setup.py sizes MAX_JOBS from psutil's *host* free memory (not the container cgroup)
# and cpu_count()//2, then runs each nvcc with --threads 4; on nemo-ci's build runners that
# fan-out gets the CUDA compiler OOM-killed (`ResourceExhausted`, dozens of
# `Killed "$CICC_PATH/cicc"`) on both x86 and aarch64. 4 jobs x 4 threads built cleanly on
# both architectures (2h47m aarch64, ~2h x86 alongside TE/flash-mla).
flash-attn = { MAX_JOBS = "4" }
transformer-engine = { NVTE_CUDA_ARCHS = "100a;103a", NVTE_FRAMEWORK = "pytorch" }
transformer-engine-torch = { NVTE_CUDA_ARCHS = "100a;103a", NVTE_FRAMEWORK = "pytorch" }
deep_ep = { TORCH_CUDA_ARCH_LIST = "10.0 10.3 10.3a", MAX_JOBS = "8" }

# CUTLASS DSL 4.5.x publishes overlapping base and cu13 wheels. Override the
# affected metadata so those versions use thec self-contained cu13 wheel, while
# 4.6.x retains libs-base/libs-core for its common Python and MLIR modules.
[[tool.uv.dependency-metadata]]
name = "nvidia-cutlass-dsl"
version = "4.5.0"
requires-dist = ["nvidia-cutlass-dsl-libs-cu13==4.5.0; extra == 'cu13'"]
provides-extras = ["cu13"]

[[tool.uv.dependency-metadata]]
name = "nvidia-cutlass-dsl"
version = "4.5.1"
requires-dist = ["nvidia-cutlass-dsl-libs-cu13==4.5.1; extra == 'cu13'"]
provides-extras = ["cu13"]

[[tool.uv.dependency-metadata]]
name = "nvidia-cutlass-dsl"
version = "4.5.2"
requires-dist = ["nvidia-cutlass-dsl-libs-cu13==4.5.2; extra == 'cu13'"]
provides-extras = ["cu13"]

[[tool.uv.dependency-metadata]]
name = "nvidia-cutlass-dsl-libs-cu13"
version = "4.5.0"
requires-dist = ["numpy", "typing-extensions", "cuda-python>=12.8"]

[[tool.uv.dependency-metadata]]
name = "nvidia-cutlass-dsl-libs-cu13"
version = "4.5.1"
requires-dist = ["numpy", "typing-extensions", "cuda-python>=12.8"]

[[tool.uv.dependency-metadata]]
name = "nvidia-cutlass-dsl-libs-cu13"
version = "4.5.2"
requires-dist = ["numpy", "typing-extensions", "cuda-python>=12.8"]

# Needed when building from source
[[tool.uv.dependency-metadata]]
name = "flash-attn"
requires-dist = ["torch", "einops", "setuptools", "psutil", "ninja"]

# The internal ADLR fork (see [tool.uv.sources]) uses the legacy setuptools
# backend with no static [project] table, so uv can't read its metadata
# without a real build; that's what makes extra-build-dependencies'
# match-runtime = true unresolvable without this. Unlike flash-attn above, a
# version IS required here: uv only allows omitting it for registry deps, not
# direct git/URL deps. build_tools/te_version.py reads build_tools/VERSION.txt
# ("2.20.0.dev0" at this commit) and appends "+<short-commit>" (this repo's
# default git abbrev is 8 chars, confirmed via `git rev-parse --short`). Must
# be re-derived if TRANSFORMER_ENGINE_REF in [tool.uv.sources] ever moves.
# requires-dist sourced from setup.py's setup_requirements(): the common list
# (pydantic, importlib-metadata, packaging) plus build_tools/pytorch.py's
# install_requirements() for NVTE_FRAMEWORK=pytorch.
[[tool.uv.dependency-metadata]]
name = "transformer-engine"
version = "2.20.0.dev0+1ac66e5a"
requires-dist = [
  "pydantic",
  "importlib-metadata>=1.0",
  "packaging",
  "torch>=2.1",
  "einops",
  "onnxscript",
  "onnx",
  "nvdlfw-inspect",
  "nvidia-cudnn-frontend>=1.25.0",
]

# Uses a normal (non-legacy) setuptools backend with build isolation left on
# (its cmake/ninja/pybind11 build deps aren't present in the base image), so
# unlike transformer-engine above it isn't blocked by match-runtime -- uv can
# build it in an isolated env to get real metadata. This entry just spares
# every future `uv lock` that build: version and the (empty) dependency list
# are copied from the real resolution's own uv.lock output, not guessed.
[[tool.uv.dependency-metadata]]
name = "nvidia-cudnn-frontend"
version = "1.28.0"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "flash-mla"
version = "1.0.0+b7643bd"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
# This version has to match the version in the commit/rev/tag used
version = "1.7.0"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "fast-hadamard-transform"
version = "1.1.0"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "mamba-ssm"
# This version has to match the version in the commit/rev/tag used
version = "2.3.2.post1"
requires-dist = ["torch", "packaging", "ninja", "causal-conv1d"]

[[tool.uv.dependency-metadata]]
name = "deep_ep"
# This version has to match the version in the commit/rev/tag used
version = "1.2.1+58397ea"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "deep_gemm"
# This version has to match the version in the commit/rev/tag used
version = "2.5.0"
requires-dist = ["torch", "packaging", "ninja"]

[[tool.uv.dependency-metadata]]
name = "nv-grouped-gemm"
# This version has to match the version in the commit/rev/tag used
version = "v1.1.4.post7"
requires-dist = ["setuptools", "wheel", "torch", "numpy"]

# TensorRT: wheel_stub packages download multi-GB binaries when built from source.
# Providing static metadata here lets `uv lock` resolve the dep graph without
# triggering the download. At `uv sync --extra trtllm` time (inside Docker where
# there is sufficient disk space), uv installs them normally via wheel_stub.
# Metadata sourced from https://pypi.org/pypi/tensorrt*/10.16.1.11/json.
[[tool.uv.dependency-metadata]]
name = "tensorrt"
version = "10.16.1.11"
requires-dist = ["tensorrt-cu13==10.16.1.11"]

[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13"
version = "10.16.1.11"
requires-dist = [
  "tensorrt-cu13-libs==10.16.1.11",
  "tensorrt-cu13-bindings==10.16.1.11",
]

# wheel_stub — downloads the actual C++ library binary at install time.
[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-libs"
version = "10.16.1.11"
requires-dist = []

# wheel_stub — downloads the Python bindings binary at install time.
[[tool.uv.dependency-metadata]]
name = "tensorrt-cu13-bindings"
version = "10.16.1.11"
requires-dist = []

# Override logsage metadata to:
# 1. Remove numpy<=2.0.2 and pandas<=2.3.3 upper bounds
#    (numpy cap conflicts with onnx>=1.21.0rc4 CVE fix via nvidia-resiliency-ext)
# 2. Bump langchain ecosystem to 1.x to address CVE GHSA-qh6h-p6c9-ff54
#    (langchain-core path traversal in legacy load_prompt, fix requires >=1.2.22)
# Tracking: https://github.com/NVIDIA/nvidia-resiliency-ext/issues/301
[[tool.uv.dependency-metadata]]
name = "logsage"
version = "0.1.7"
requires-dist = [
  "drain3>=0.9.11,<0.10.0",
  "langchain>=1.2.0,<2.0.0",
  "langchain-core>=1.2.22,<2.0.0",
  "langchain-nvidia-ai-endpoints>=1.0.0,<2.0.0",
  "nh3>=0.3.1,<0.4.0",
  "numpy",
  "pandas",
  "pydantic-settings>=2.11.0,<3.0.0",
  "requests>=2.32.5,<3.0.0",
]

# Override drain3 to relax cachetools==4.2.1 pin (conflicts with mlflow's cachetools>=5.0.0)
# Tracking: https://github.com/logpai/Drain3/issues/119
[[tool.uv.dependency-metadata]]
name = "drain3"
version = "0.9.11"
requires-dist = ["jsonpickle", "cachetools>=4.2.1"]

[[tool.uv.dependency-metadata]]
name = "nvidia-resiliency-ext"
version = "0.8.0+d23f0a1"
requires-dist = []

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
)/
'''

[tool.pytest.ini_options]
addopts = "--durations=100 -s -rA -x"
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
  "run_first: marks tests that should run before others",
  "mcore: marks tests that require the mcore extra",
  "hf_gated: marks tests that require HuggingFace token access for gated models",
  "automodel: marks tests that require the automodel extra",
  "vllm: marks tests that require the vllm extra",
  "sglang: marks tests that require the sglang extra",
  "trtllm: marks tests that require the trtllm extra",
  "nemo_gym: marks tests that require the nemo_gym extra",
]

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = ["**/*venv/**/*"]

[tool.coverage.run]
concurrency = ["thread", "multiprocessing"]
omit = ["/tmp/*"]

[tool.coverage.paths]
source = ["nemo_rl/", "/opt/nemo-rl/nemo_rl/"]

[tool.ruff.lint]
# Enable all `pydocstyle` rules, limiting to those that adhere to the
# Google convention via `convention = "google"`, below.
select = ["D", "F"]

# - On top of the Google convention, disable `D417`, which requires
#   documentation for every function parameter.
# - F841: local variable assigned but never used (exluced to favor readability)
# TODO: Remove D10 once we are about to release to get all the docstrings written
ignore = ["D417", "D10", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Section to exclude errors for different file types
[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["D"]
"research/*/tests/**" = ["D"]
# Ignore all files that end in `_test.py`.
"*_test.py" = ["D"]
# Ignore F401 (import but unused) in __init__.py
"__init__.py" = ["F401"]

# FlashInfer cache wheels contain precompiled artifacts and no runtime requirements.
# Reuse the metadata recorded in the production lock instead of streaming large
# GitHub wheels solely to inspect their empty dependency list.
[[tool.uv.dependency-metadata]]
name = "flashinfer-jit-cache"
version = "0.6.8.post1+cu130"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "flashinfer-cubin"
version = "0.6.8.post1"
requires-dist = []
