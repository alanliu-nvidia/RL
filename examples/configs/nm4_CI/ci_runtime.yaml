# Settings for the explicitly selected functional suite, not production defaults.
policy:
  megatron_cfg:
    attention_backend: auto
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    model_overrides:
      saved_args:
        attention_backend: auto
        mimo_vision_encoder_attention_backend: auto
logger:
  wandb_enabled: false
  tensorboard_enabled: true
  monitor_gpus: false
